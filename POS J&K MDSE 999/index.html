<body><div id="app"></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{'use strict';
const KEY='jkmdse999_offline_v1';let db,session=null,page='dashboard',cart={},currentReceipt=null,filters={q:'',from:'',to:'',cashier:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cash=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const dateTime=d=>new Date(d).toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'});
const localDay=value=>{let d=new Date(value);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function load(){try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch{db=null}if(!db||!Array.isArray(db.users))db={users:[{id:'u-admin',username:'admin',password:'Admin999!',name:'Store Administrator',role:'ADMIN',active:true}],products:[],sales:[],seq:1001};save()}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(msg,error=false){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast ${error?'error':''}">${esc(msg)}</div>`;setTimeout(()=>r.innerHTML='',3000)}
const admin=()=>session?.role==='ADMIN';
function login(user){session={id:user.id,username:user.username,name:user.name,role:user.role};page=admin()?'dashboard':'sale';render()}
function logout(){session=null;cart={};currentReceipt=null;page='login';render()}
function activeProducts(){return db.products.filter(p=>p.active)}
function navLink(p,label,icon){return `<a href="#${p}" class="nav ${page===p?'active':''}" onclick="POS.go('${p}');return false"><span class="ico">${icon}</span><span>${label}</span></a>`}
function shell(content){return `<div class="shell"><aside class="sidebar"><a class="brand" href="#dashboard" onclick="POS.go('${admin()?'dashboard':'sale'}');return false"><b class="brand-icon"><img src="store-logo.jpg" alt="J&amp;K MDSE logo"></b><span>MDSE STORE<small>999 · POINT OF SALE</small></span></a><p class="nav-label">WORKSPACE</p>${admin()?navLink('dashboard','Overview','▦'):''}${navLink('sale','New sale','◈')}${admin()?navLink('products','Products','▤'):''}${admin()?navLink('users','Team','♙'):''}${navLink('history',admin()?'Transactions':'My transactions','◷')}${admin()?navLink('reports','Reports','▥'):''}<div class="side-bottom"><div class="user-chip"><i class="avatar">${esc((session?.name||'U').slice(0,1).toUpperCase())}</i><b>${esc(session?.name)}</b><small>${esc(session?.role)}</small></div><a href="#logout" class="nav" onclick="POS.logout();return false"><span class="ico">↪</span><span>Sign out</span></a></div></aside><main class="main">${content}<footer>J&amp;K MDSE STORE <span>·</span> 999 <span class="right">OFFLINE POINT OF SALE</span></footer></main></div>`}
function header(crumb,title,extra=''){return `<header class="topbar"><div><span class="crumb">${crumb}</span><h1>${title}</h1></div>${extra}</header>`}
function render(){const app=document.getElementById('app');if(!session){app.innerHTML=loginView();return}if(!admin()&&!['sale','history','receipt'].includes(page))page='sale';let view={dashboard:dashboardView,products:productsView,users:usersView,sale:saleView,history:historyView,reports:reportsView,receipt:receiptView}[page]||dashboardView;app.innerHTML=shell(view());}
function loginView(){return `<div class="login"><main class="login-box"><div class="mark photo-mark"><img src="store-logo.jpg" alt="J&amp;K MDSE Store 999"></div><span class="eyebrow" style="color:var(--green)">J&amp;K MDSE STORE · 999</span><h1>Welcome back.</h1><p class="muted">Sign in to open your point of sale.</p><form onsubmit="POS.signIn(event)"><label class="field">Username<input name="username" autocomplete="username" required autofocus></label><label class="field">Password<input type="password" name="password" autocomplete="current-password" required></label><button class="btn primary wide">Sign in <span>→</span></button></form><p class="tiny muted" style="text-align:center;margin-top:24px">First login: <b>admin</b> / <b>Admin999!</b></p></main><aside class="login-art"><div><img class="login-store-poster" src="store-logo.jpg" alt="J&amp;K MDSE Store 999"><span class="badge" style="background:#ffffff1c;color:#d9e9de">RETAIL · MADE SIMPLE</span><h2>Every sale,<br>handled with care.</h2><p>Keep your products, inventory and daily sales organized in one place.</p></div><div class="login-foot">J&amp;K MDSE STORE · 999</div></aside></div>`}
function dashboardView(){let today=localDay(new Date()),sales=db.sales.filter(s=>localDay(s.date)===today),gross=sales.reduce((a,s)=>a+s.total,0),low=activeProducts().filter(p=>p.stock<=5).sort((a,b)=>a.stock-b.stock).slice(0,6);return `${header('WORKSPACE / OVERVIEW',`Good day, ${esc(session.name)}`,`<button class="btn primary" onclick="POS.go('sale')">＋ New sale</button>`)}<section class="welcome"><div><span class="badge">STORE OVERVIEW</span><h2>Your business at a glance.</h2><p>Here’s what’s happening at J&amp;K MDSE today.</p></div><div class="spark">✳</div></section><section class="stats"><article class="stat"><span class="stat-label">TODAY’S SALES</span><strong>${cash(gross)}</strong><small>Gross sales today</small><i class="stat-ico">₱</i></article><article class="stat"><span class="stat-label">TRANSACTIONS</span><strong>${sales.length}</strong><small>Completed today</small><i class="stat-ico">↗</i></article><article class="stat"><span class="stat-label">ACTIVE PRODUCTS</span><strong>${activeProducts().length}</strong><small>Listed in inventory</small><i class="stat-ico">▤</i></article></section><section class="grid2"><article class="panel"><div class="panel-head"><div><span class="eyebrow">INVENTORY WATCH</span><h3>Needs attention</h3></div><button class="link" onclick="POS.go('products')">View inventory →</button></div>${low.length?low.map(p=>`<div class="stock-row"><span class="quick-icon">▧</span><b>${esc(p.name)}</b><span class="stock-count">${p.stock} left</span></div>`).join(''):'<div class="empty">All stocked up. No low inventory items.</div>'}</article><article class="panel"><span class="eyebrow">QUICK ACTIONS</span><h3 style="margin:5px 0 12px">Make it happen.</h3>${[['sale','＋','Start a new sale','Ring up a customer'],['products','▤','Manage products','Update your inventory'],['reports','▥','View reports','See sales performance']].map(([p,i,t,s])=>`<a class="quick-row" href="#${p}" onclick="POS.go('${p}');return false"><i class="quick-icon">${i}</i><span><b>${t}</b><small>${s}</small></span><span class="arr">→</span></a>`).join('')}</article></section>`}
function productsView(){let q=(filters.q||'').toLowerCase(),list=activeProducts().filter(p=>(p.name+' '+p.category).toLowerCase().includes(q));return `${header('WORKSPACE / INVENTORY','Products')}<div class="toolbar"><label class="search">⌕<input placeholder="Search product or category" value="${esc(filters.q)}" oninput="POS.search(this.value)"></label><button class="btn primary" onclick="POS.productModal()">＋ Add product</button></div><div class="panel table-wrap"><table><thead><tr><th>PRODUCT</th><th>CATEGORY</th><th>PRICE</th><th>STOCK</th><th>STATUS</th><th></th></tr></thead><tbody>${list.length?list.map(p=>`<tr><td><b>${p.image?`<img src="${p.image}" style="width:34px;height:34px;object-fit:cover;border-radius:7px;vertical-align:middle;margin-right:8px">`:''}${esc(p.name)}</b><small>SKU #${esc(p.id)}</small></td><td>${esc(p.category)}</td><td>${cash(p.price)}</td><td>${p.stock}</td><td><span class="pill ${p.stock<=5?'warn':'ok'}">${p.stock<=0?'Out of stock':p.stock<=5?'Low stock':'In stock'}</span></td><td><div class="actions"><button class="text-btn" onclick="POS.productModal('${p.id}')">Edit</button><button class="text-btn red" onclick="POS.deleteProduct('${p.id}')">Remove</button></div></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No products found. Add your first item.</td></tr>'}</tbody></table></div>`}
function usersView(){return `${header('WORKSPACE / TEAM','Team members',`<button class="btn primary" onclick="POS.userModal()">＋ Add user</button>`)}<div class="panel table-wrap"><table><thead><tr><th>NAME</th><th>USERNAME</th><th>ROLE</th><th>STATUS</th><th></th></tr></thead><tbody>${db.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td><span class="pill ${u.active?'ok':'warn'}">${u.active?'Active':'Inactive'}</span></td><td><div class="actions"><button class="text-btn" onclick="POS.userModal('${u.id}')">Edit</button><button class="text-btn ${u.active?'red':''}" ${u.id===session.id?'disabled':''} onclick="POS.toggleUser('${u.id}')">${u.active?'Deactivate':'Activate'}</button></div></td></tr>`).join('')}</tbody></table></div>`}
function saleView(){let products=activeProducts().filter(p=>p.stock>0&&(p.name+' '+p.category).toLowerCase().includes((filters.q||'').toLowerCase()));let entries=Object.entries(cart),count=entries.reduce((a,[,x])=>a+x.qty,0),subtotal=entries.reduce((a,[,x])=>a+x.price*x.qty,0),type=document.getElementById('discountType')?.value||'NONE',value=Number(document.getElementById('discountValue')?.value||0),discount=type==='PERCENT'?subtotal*Math.min(value,100)/100:type==='FIXED'?Math.min(value,subtotal):0,total=subtotal-discount,paid=Number(document.getElementById('paid')?.value||0);return `${header('POINT OF SALE / CHECKOUT','New sale',`<button class="btn" onclick="POS.go('history')">◷ Recent sales</button>`)}<div class="pos-grid"><section class="catalog panel"><div class="panel-head"><div><span class="eyebrow">PRODUCT CATALOG</span><h3>Choose items</h3></div><label class="search" style="width:210px;height:36px">⌕<input placeholder="Search products" value="${esc(filters.q)}" oninput="POS.search(this.value,'sale')"></label></div><div class="product-grid">${products.length?products.map(p=>`<button class="product-card" onclick="POS.addCart('${p.id}')">${p.image?`<img class="product-img" src="${p.image}" alt="${esc(p.name)}">`:'<span class="product-img product-placeholder">▧</span>'}<b>${esc(p.name)}</b><small>${esc(p.category)}</small><strong>${cash(p.price)}</strong><em>${p.stock} available</em></button>`).join(''):'<div class="empty">No products in stock. Ask an admin to update inventory.</div>'}</div></section><aside class="cart panel"><div class="panel-head"><div><span class="eyebrow">CURRENT ORDER</span><h3>Cart <span class="count">${count}</span></h3></div><button class="link" onclick="POS.clearCart()">Clear</button></div><div class="cart-list">${entries.length?entries.map(([id,x])=>`<div class="cart-item"><div><b>${esc(x.name)}</b><small>${cash(x.price)} each</small></div><div class="qty"><button onclick="POS.qty('${id}',-1)">−</button><span>${x.qty}</span><button onclick="POS.qty('${id}',1)">+</button></div><strong>${cash(x.price*x.qty)}</strong></div>`).join(''):'<div class="empty">Select products to start an order.</div>'}</div><div class="discount-row"><label class="field">Discount<select id="discountType" class="control" onchange="POS.refreshSale()"><option value="NONE" ${type==='NONE'?'selected':''}>No discount</option><option value="PERCENT" ${type==='PERCENT'?'selected':''}>Percent (%)</option><option value="FIXED" ${type==='FIXED'?'selected':''}>Fixed (₱)</option></select></label><label class="field">Value<input id="discountValue" class="control" type="number" min="0" step="0.01" value="${value}" ${type==='NONE'?'disabled':''} oninput="POS.refreshSale()"></label></div><div class="totals"><div class="total-row"><span>Subtotal</span><b>${cash(subtotal)}</b></div><div class="total-row"><span>Discount</span><b>− ${cash(discount)}</b></div><div class="total-row grand"><span>Total due</span><b>${cash(total)}</b></div></div><label class="tender">Amount tendered<input id="paid" type="number" min="0" step="0.01" value="${paid||''}" placeholder="0.00" oninput="POS.refreshSale()"></label><div class="change"><span>Change</span><b>${cash(Math.max(0,paid-total))}</b></div><button class="btn primary wide" onclick="POS.checkout()" ${!entries.length?'disabled':''}>Complete sale →</button></aside></div>`}
function filteredSales(){let from=filters.from,to=filters.to,cashier=filters.cashier;return db.sales.filter(s=>(admin()||s.userId===session.id)&&(!from||localDay(s.date)>=from)&&(!to||localDay(s.date)<=to)&&(!admin()||!cashier||s.userId===cashier)).sort((a,b)=>new Date(b.date)-new Date(a.date))}
function historyView(){let sales=filteredSales();return `${header('WORKSPACE / SALES',admin()?'Transactions':'My transactions')}<form class="filters panel" onsubmit="POS.applyFilters(event)"><label class="field">From<input name="from" type="date" value="${esc(filters.from)}"></label><label class="field">To<input name="to" type="date" value="${esc(filters.to)}"></label>${admin()?`<label class="field">Cashier<select name="cashier"><option value="">All cashiers</option>${db.users.filter(u=>u.role==='CASHIER').map(u=>`<option value="${u.id}" ${filters.cashier===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></label>`:''}<button class="btn primary">Apply filters</button><button type="button" class="btn" onclick="POS.resetFilters()">Reset</button></form><div class="panel table-wrap"><table><thead><tr><th>TRANSACTION</th><th>DATE &amp; TIME</th><th>CASHIER</th><th>ITEMS</th><th>TOTAL</th><th></th></tr></thead><tbody>${sales.length?sales.map(s=>`<tr><td><b>${esc(s.number)}</b></td><td>${dateTime(s.date)}</td><td>${esc(s.cashier)}</td><td>${s.items.map(i=>`${esc(i.name)} × ${i.qty}`).join(", ")}</td><td><b>${cash(s.total)}</b></td><td><button class="text-btn" onclick="POS.openReceipt('${s.id}')">Receipt ↗</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No transactions match your filters.</td></tr>'}</tbody></table></div>`}
function periodKey(date,period){let d=new Date(date);if(period==='day')return localDay(date);if(period==='month')return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;if(period==='year')return String(d.getFullYear());let one=new Date(d.getFullYear(),0,1),week=Math.ceil((((d-one)/86400000)+one.getDay()+1)/7);return `${d.getFullYear()} · Week ${String(week).padStart(2,'0')}`}
function reportsView(){let period=document.body.dataset.period||'month',groups={};for(let s of db.sales){let k=periodKey(s.date,period);groups[k]??={period:k,count:0,sales:0};groups[k].count++;groups[k].sales+=s.total}let rows=Object.values(groups).sort((a,b)=>b.period.localeCompare(a.period)).slice(0,80),sum=rows.reduce((a,r)=>a+r.sales,0),count=rows.reduce((a,r)=>a+r.count,0);return `${header('WORKSPACE / ANALYTICS','Sales reports')}<div class="toolbar"><div class="segmented">${['day','week','month','year'].map(x=>`<button class="${period===x?'active':''}" onclick="POS.setPeriod('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><span class="muted tiny">Summary across ${rows.length} ${period} period${rows.length===1?'':'s'}</span></div><div class="report-stat"><article class="stat"><span class="stat-label">SALES TOTAL</span><strong>${cash(sum)}</strong></article><article class="stat"><span class="stat-label">TRANSACTIONS</span><strong>${count}</strong></article></div><div class="panel table-wrap"><table><thead><tr><th>PERIOD</th><th>TRANSACTIONS</th><th>SALES TOTAL</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td><b>${esc(r.period)}</b></td><td>${r.count}</td><td><b>${cash(r.sales)}</b></td></tr>`).join(''):'<tr><td colspan="3" class="empty">No sales recorded yet.</td></tr>'}</tbody></table></div>`}
function receiptView(){let s=currentReceipt||db.sales.find(x=>x.id===new URLSearchParams(location.hash.split('?')[1]||'').get('id'));if(!s){page='history';return historyView()}return `${header('SALES / RECEIPT',`Receipt ${esc(s.number)}`,`<div class="receipt-actions"><button class="btn" onclick="POS.go('history')">← Transactions</button><button class="btn primary" onclick="window.print()">Print receipt</button></div>`)}<div class="receipt-wrap"><article class="receipt"><div class="receipt-mark">J&amp;K</div><p class="eyebrow">J&amp;K MDSE STORE</p><h2>Store 999</h2><p class="muted">Thank you for shopping with us.</p><hr><div class="receipt-meta"><span>Transaction</span><b>${esc(s.number)}</b><span>Date</span><b>${dateTime(s.date)}</b><span>Cashier</span><b>${esc(s.cashier)}</b></div><hr><div class="receipt-line header"><span>ITEM</span><span>QTY × PRICE</span><span>AMOUNT</span></div>${s.items.map(i=>`<div class="receipt-line"><span>${esc(i.name)}</span><span>${i.qty} × ${cash(i.price)}</span><span>${cash(i.qty*i.price)}</span></div>`).join('')}<hr><div class="receipt-totals"><div><span>Subtotal</span><b>${cash(s.subtotal)}</b></div><div><span>Discount</span><b>− ${cash(s.discount)}</b></div><div class="grand"><span>TOTAL</span><b>${cash(s.total)}</b></div><div><span>Amount paid</span><b>${cash(s.paid)}</b></div><div><span>Change</span><b>${cash(s.change)}</b></div></div><hr><p class="receipt-thanks">We appreciate your visit!</p></article></div>`}
function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)POS.closeModal()"><section class="modal">${html}</section></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function productModal(id=''){let p=db.products.find(x=>x.id===id)||{name:'',price:'',category:'',stock:0,image:''};modal(`<div class="modal-title"><div><span class="eyebrow">INVENTORY</span><h3>${id?'Edit product':'Add product'}</h3></div><button class="close" onclick="POS.closeModal()">×</button></div><form onsubmit="POS.saveProduct(event,'${id}')"><div class="form-grid"><label class="field full">Product name<input name="name" required maxlength="120" value="${esc(p.name)}"></label><label class="field">Price (₱)<input name="price" type="number" min="0" step="0.01" required value="${esc(p.price)}"></label><label class="field">Stock quantity<input name="stock" type="number" min="0" step="1" required value="${esc(p.stock)}"></label><label class="field full">Category<input name="category" required value="${esc(p.category)}"></label><label class="field full">Product picture<input type="file" name="image" accept="image/*" onchange="POS.previewImage(this)"></label><img id="photoPreview" class="photo-preview ${p.image?'':'hidden'}" src="${p.image||''}" alt="Product preview"><input type="hidden" name="oldImage" value="${p.image||''}"></div><div class="modal-actions"><button type="button" class="btn" onclick="POS.closeModal()">Cancel</button><button class="btn primary">Save product</button></div></form>`)}
function userModal(id=''){let u=db.users.find(x=>x.id===id)||{username:'',name:'',role:'CASHIER',active:true};modal(`<div class="modal-title"><div><span class="eyebrow">ACCESS</span><h3>${id?'Edit team member':'Add team member'}</h3></div><button class="close" onclick="POS.closeModal()">×</button></div><form onsubmit="POS.saveUser(event,'${id}')"><div class="form-grid"><label class="field full">Full name<input name="name" required value="${esc(u.name)}"></label><label class="field full">Username<input name="username" required value="${esc(u.username)}"></label><label class="field full">Role<select name="role"><option value="CASHIER" ${u.role==='CASHIER'?'selected':''}>Cashier</option><option value="ADMIN" ${u.role==='ADMIN'?'selected':''}>Admin</option></select></label><label class="field full">${id?'New password (leave blank to keep current)':'Password'}<input name="password" type="password" ${id?'':'required'} minlength="6"></label></div><div class="modal-actions"><button type="button" class="btn" onclick="POS.closeModal()">Cancel</button><button class="btn primary">Save user</button></div></form>`)}
async function readImage(file){if(!file)return '';if(!file.type.startsWith('image/'))throw Error('Choose an image file.');return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('Could not read image.'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('Could not open image.'));img.onload=()=>{let scale=Math.min(1,500/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}
async function saveProduct(e,id){e.preventDefault();let f=new FormData(e.target),old=f.get('oldImage'),image=old;try{if(f.get('image').size)image=await readImage(f.get('image'));let p={id:id||'p-'+Date.now(),name:f.get('name').trim(),price:Number(f.get('price')),category:f.get('category').trim(),stock:Number(f.get('stock')),image,active:true};if(id){let i=db.products.findIndex(x=>x.id===id);p.active=db.products[i].active;db.products[i]=p}else db.products.push(p);save();closeModal();render();toast('Product saved.')}catch(err){toast(err.message||'Image could not be saved.',true)}}
function saveUser(e,id){e.preventDefault();let f=new FormData(e.target),username=f.get('username').trim();if(db.users.some(u=>u.username.toLowerCase()===username.toLowerCase()&&u.id!==id)){toast('That username is already in use.',true);return}if(id){let u=db.users.find(x=>x.id===id);u.username=username;u.name=f.get('name').trim();u.role=f.get('role');if(f.get('password'))u.password=f.get('password')}else db.users.push({id:'u-'+Date.now(),username,password:f.get('password'),name:f.get('name').trim(),role:f.get('role'),active:true});save();closeModal();render();toast('User saved.')}
function checkout(){let entries=Object.entries(cart);if(!entries.length)return toast('Cart is empty.',true);let subtotal=entries.reduce((a,[,i])=>a+i.price*i.qty,0),type=document.getElementById('discountType').value,val=Number(document.getElementById('discountValue').value||0),discount=type==='PERCENT'?subtotal*val/100:type==='FIXED'?val:0,paid=Number(document.getElementById('paid').value);discount=Math.round(discount*100)/100;if(discount<0||discount>subtotal){toast('Discount must be between 0 and subtotal.',true);return}let total=Math.round((subtotal-discount)*100)/100;if(!Number.isFinite(paid)||paid<total){toast('Amount tendered must cover the total.',true);return}for(let [id,item] of entries){let p=db.products.find(x=>x.id===id&&x.active);if(!p||p.stock<item.qty){toast(`Insufficient stock for ${item.name}.`,true);return}}let sale={id:'s-'+Date.now()+'-'+Math.random().toString(16).slice(2,6),number:'JK'+String(db.seq++),userId:session.id,cashier:session.name,date:new Date().toISOString(),items:entries.map(([id,i])=>({productId:id,name:i.name,qty:i.qty,price:i.price})),subtotal,discount,total,paid,change:Math.round((paid-total)*100)/100};for(let [id,i] of entries)db.products.find(p=>p.id===id).stock-=i.qty;db.sales.push(sale);save();cart={};currentReceipt=sale;page='receipt';render();toast('Sale completed. Receipt is ready.')}
function addCart(id){let p=db.products.find(x=>x.id===id);if(!p||p.stock<=0)return;if(cart[id]){if(cart[id].qty>=p.stock){toast('Quantity exceeds available stock.',true);return}cart[id].qty++}else cart[id]={name:p.name,price:p.price,qty:1};render()}
function qty(id,d){if(!cart[id])return;let p=db.products.find(x=>x.id===id);cart[id].qty+=d;if(cart[id].qty<1)delete cart[id];else if(cart[id].qty>p.stock){cart[id].qty=p.stock;toast('Quantity adjusted to available stock.',true)}render()}
function deleteProduct(id){let p=db.products.find(x=>x.id===id);if(!p)return;if(!confirm(`Remove “${p.name}” from the catalog?`))return;p.active=false;save();render();toast('Product removed.')}
function toggleUser(id){let u=db.users.find(x=>x.id===id);if(!u||u.id===session.id)return;u.active=!u.active;save();render();toast(u.active?'User activated.':'User deactivated.')}
function applyFilters(e){e.preventDefault();let f=new FormData(e.target);filters.from=f.get('from')||'';filters.to=f.get('to')||'';filters.cashier=f.get('cashier')||'';render()}
function openReceipt(id){let s=db.sales.find(x=>x.id===id);if(!s||(!admin()&&s.userId!==session.id))return toast('Receipt is not available.',true);currentReceipt=s;page='receipt';render()}
function signIn(e){e.preventDefault();let f=new FormData(e.target),u=db.users.find(x=>x.active&&x.username.toLowerCase()===f.get('username').trim().toLowerCase()&&x.password===f.get('password'));if(!u){toast('Username or password is incorrect.',true);return}filters={q:'',from:'',to:'',cashier:''};login(u)}
function search(value,where='products'){filters.q=value;let cursor=where;render();let input=document.querySelector(where==='sale'?'.catalog .search input':'.toolbar .search input');if(input){input.focus();input.setSelectionRange(value.length,value.length)}}
function setPeriod(p){document.body.dataset.period=p;render()}
function refreshSale(){let active=document.activeElement,id=active?.id,start=active?.selectionStart,end=active?.selectionEnd,y=window.scrollY;render();if(id){let next=document.getElementById(id);if(next){next.focus();if(Number.isInteger(start)&&next.setSelectionRange)next.setSelectionRange(start,end)}}window.scrollTo(0,y)}
function go(p){page=p;filters.q='';if(p==='sale')cart=cart||{};render()}
function resetFilters(){filters.from='';filters.to='';filters.cashier='';render()}
function previewImage(input){let f=input.files?.[0];if(!f)return;const img=document.getElementById('photoPreview');img.src=URL.createObjectURL(f);img.classList.remove('hidden')}
window.POS={go,logout,signIn,search,productModal,userModal,closeModal,saveProduct,saveUser,previewImage,deleteProduct,toggleUser,addCart,qty,clearCart:()=>{cart={};render()},checkout,refreshSale,applyFilters,resetFilters,openReceipt,setPeriod};
load();render();window.addEventListener('storage',()=>{load();render()});
})();
</script>
</body></html>
