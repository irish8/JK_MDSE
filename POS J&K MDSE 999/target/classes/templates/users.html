<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team · J&K MDSE</title><link rel="stylesheet" href="/app.css"></head><body><div class="shell"><aside class="sidebar"><a class="brand" href="/admin"><b class="brand-logo-wrap"><img src="/store-logo.jpg" alt="J&amp;K MDSE logo"></b><span>MDSE STORE<small>999 · POINT OF SALE</small></span></a><p class="nav-label">WORKSPACE</p><a class="nav" href="/admin">▦ <span>Overview</span></a><a class="nav" href="/sale">◈ <span>New sale</span></a><a class="nav" href="/products">▤ <span>Products</span></a><a class="nav active" href="/users">♙ <span>Team</span></a><a class="nav" href="/history">◷ <span>Transactions</span></a><a class="nav" href="/reports">▥ <span>Reports</span></a><div class="sidebar-bottom"><div class="user-chip"><i th:text="${#strings.substring(user.name,0,1)}">A</i><span th:text="${user.name}">Admin</span><small>ADMIN</small></div><a href="/logout" class="nav">↪ <span>Sign out</span></a></div></aside><main class="main"><header class="topbar"><div><span class="crumb">WORKSPACE / TEAM</span><h1>Team members</h1></div><button class="button primary" onclick="document.getElementById('userDialog').showModal()">＋ Add user</button></header><div class="panel table-panel"><table><thead><tr><th>NAME</th><th>USERNAME</th><th>ROLE</th><th>STATUS</th><th></th></tr></thead><tbody><tr th:each="u:${users}"><td><b th:text="${u.full_name}">Name</b></td><td th:text="${u.username}">username</td><td th:text="${u.role}">CASHIER</td><td><span class="pill" th:classappend="${u.is_active}?'success':'warning'" th:text="${u.is_active}?'Active':'Inactive'">Active</span></td><td class="actions"><button class="icon-button" th:attr="onclick=|editUser(${u.id},'${u.username}','${u.full_name}','${u.role}')|">Edit</button><form th:action="@{'/users/toggle/'+${u.id}}" method="post"><button class="icon-button danger" th:text="${u.is_active}?'Deactivate':'Activate'">Deactivate</button></form></td></tr></tbody></table></div><footer>J&K MDSE STORE <span>·</span> 999 <span class="right">POINT OF SALE</span></footer></main></div><dialog id="userDialog" class="modal"><form id="userForm" method="post" action="/users/save" class="stack"><div class="panel-head"><div><span class="eyebrow">ACCESS</span><h3>Add team member</h3></div><button type="button" class="icon-button" onclick="this.closest('dialog').close()">✕</button></div><input type="hidden" name="id" id="userId"><label>Full name<input name="full_name" required></label><label>Username<input name="username" required></label><label>Role<select name="role"><option value="CASHIER">Cashier</option><option value="ADMIN">Admin</option></select></label><label>Password <small class="muted">Required for new users; leave blank to keep current on edit.</small><input type="password" name="password" minlength="8"></label><button class="button primary">Save user</button></form></dialog><script>function editUser(id,username,name,role){let f=document.getElementById('userForm');f.reset();document.getElementById('userId').value=id;f.elements.username.value=username;f.elements.full_name.value=name;f.elements.role.value=role;document.getElementById('userDialog').showModal()}</script></body></html>
