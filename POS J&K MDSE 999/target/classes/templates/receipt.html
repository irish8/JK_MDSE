<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipt · J&K MDSE</title><link rel="stylesheet" href="/app.css"></head><body class="receipt-page"><div class="receipt-actions"><a class="button secondary" href="/history">← Transactions</a><button class="button primary" onclick="window.print()">Print receipt</button></div><article class="receipt"><div class="receipt-brand">J<span>&</span>K</div><p class="eyebrow">J&K MDSE STORE</p><h1>Store 999</h1><p class="muted">Thank you for shopping with us.</p><hr><div class="receipt-meta"><span>Transaction</span><b th:text="${sale.transaction_no}">JK-0001</b><span>Date</span><b th:text="${#dates.format(sale.created_at,'MMM d, yyyy · h:mm a')}">Date</b><span>Cashier</span><b th:text="${sale.cashier}">Name</b></div><hr><div class="receipt-line header"><span>ITEM</span><span>QTY × PRICE</span><span>AMOUNT</span></div><div class="receipt-line" th:each="i:${items}"><span th:text="${i.product_name}">Item</span><span th:text="|${i.quantity} × ₱${#numbers.formatDecimal(i.unit_price,1,2)}|">1 × 0</span><b th:text="|₱ ${#numbers.formatDecimal(i.line_total,1,2)}|">₱0</b></div><hr><div class="receipt-total"><div><span>Subtotal</span><b th:text="|₱ ${#numbers.formatDecimal(sale.subtotal,1,2)}|">₱0</b></div><div><span>Discount</span><b th:text="|− ₱ ${#numbers.formatDecimal(sale.discount,1,2)}|">₱0</b></div><div class="grand"><span>TOTAL</span><b th:text="|₱ ${#numbers.formatDecimal(sale.total,1,2)}|">₱0</b></div><div><span>Amount paid</span><b th:text="|₱ ${#numbers.formatDecimal(sale.amount_paid,1,2)}|">₱0</b></div><div><span>Change</span><b th:text="|₱ ${#numbers.formatDecimal(sale.change_due,1,2)}|">₱0</b></div></div><hr><p class="receipt-thanks">We appreciate your visit!</p></article></body></html>
