<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports · J&K MDSE</title><link rel="stylesheet" href="/app.css"></head><body><div class="shell"><aside class="sidebar"><a class="brand" href="/admin"><b class="brand-logo-wrap"><img src="/store-logo.jpg" alt="J&amp;K MDSE logo"></b><span>MDSE STORE<small>999 · POINT OF SALE</small></span></a><p class="nav-label">WORKSPACE</p><a class="nav" href="/admin">▦ <span>Overview</span></a><a class="nav" href="/sale">◈ <span>New sale</span></a><a class="nav" href="/products">▤ <span>Products</span></a><a class="nav" href="/users">♙ <span>Team</span></a><a class="nav" href="/history">◷ <span>Transactions</span></a><a class="nav active" href="/reports">▥ <span>Reports</span></a><div class="sidebar-bottom"><div class="user-chip"><i th:text="${#strings.substring(user.name,0,1)}">A</i><span th:text="${user.name}">Admin</span><small>ADMIN</small></div><a href="/logout" class="nav">↪ <span>Sign out</span></a></div></aside><main class="main"><header class="topbar"><div><span class="crumb">WORKSPACE / ANALYTICS</span><h1>Sales reports</h1></div></header><form class="filters panel" method="get"><label>Group by<select name="period"><option value="day" th:selected="${period=='day'}">Day</option><option value="week" th:selected="${period=='week'}">Week</option><option value="month" th:selected="${period=='month'}">Month</option><option value="year" th:selected="${period=='year'}">Year</option></select></label><button class="button primary">Update report</button></form><div class="panel table-panel"><table><thead><tr><th>PERIOD</th><th>TRANSACTIONS</th><th>SALES TOTAL</th></tr></thead><tbody><tr th:each="r:${report}"><td th:text="${r.period}">Period</td><td th:text="${r.transactions}">0</td><td th:text="|₱ ${#numbers.formatDecimal(r.sales,1,2)}|">₱0</td></tr><tr th:if="${#lists.isEmpty(report)}"><td colspan="3" class="empty">No sales recorded for this period.</td></tr></tbody></table></div><footer>J&K MDSE STORE <span>·</span> 999 <span class="right">POINT OF SALE</span></footer></main></div></body></html>
