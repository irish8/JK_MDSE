<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transactions · J&K MDSE</title><link rel="stylesheet" href="/app.css"></head><body><div class="shell"><aside class="sidebar"><a class="brand" href="/admin"><b class="brand-logo-wrap"><img src="/store-logo.jpg" alt="J&amp;K MDSE logo"></b><span>MDSE STORE<small>999 · POINT OF SALE</small></span></a><p class="nav-label">WORKSPACE</p><a class="nav" th:if="${role=='ADMIN'}" href="/admin">▦ <span>Overview</span></a><a class="nav" href="/sale">◈ <span>New sale</span></a><a class="nav" th:if="${role=='ADMIN'}" href="/products">▤ <span>Products</span></a><a class="nav" th:if="${role=='ADMIN'}" href="/users">♙ <span>Team</span></a><a class="nav active" href="/history">◷ <span>Transactions</span></a><a class="nav" th:if="${role=='ADMIN'}" href="/reports">▥ <span>Reports</span></a><div class="sidebar-bottom"><div class="user-chip"><i th:text="${#strings.substring(user.name,0,1)}">A</i><span th:text="${user.name}">User</span><small th:text="${role}">ADMIN</small></div><a href="/logout" class="nav">↪ <span>Sign out</span></a></div></aside><main class="main"><header class="topbar"><div><span class="crumb">WORKSPACE / SALES</span><h1>Transactions</h1></div></header><form class="filters panel" method="get"><label>From<input name="from" type="date" th:value="${from}"></label><label>To<input name="to" type="date" th:value="${to}"></label><label th:if="${role=='ADMIN'}">Cashier<select name="cashier"><option value="">All cashiers</option><option th:each="c:${cashiers}" th:value="${c.id}" th:text="${c.full_name}" th:selected="${cashier==c.id}"></option></select></label><button class="button primary">Apply filters</button></form><div class="panel table-panel"><table><thead><tr><th>TRANSACTION</th><th>DATE & TIME</th><th>CASHIER</th><th>TOTAL</th><th></th></tr></thead><tbody><tr th:each="s:${sales}"><td><b th:text="${s.transaction_no}">JK#</b></td><td th:text="${#dates.format(s.created_at,'MMM d, yyyy · h:mm a')}">Date</td><td th:text="${s.cashier}">Cashier</td><td th:text="|₱ ${#numbers.formatDecimal(s.total,1,2)}|">₱0</td><td><a class="icon-button" th:href="@{/receipt(id=${s.id})}">Receipt ↗</a></td></tr><tr th:if="${#lists.isEmpty(sales)}"><td colspan="5" class="empty">No transactions match your filters.</td></tr></tbody></table></div><footer>J&K MDSE STORE <span>·</span> 999 <span class="right">POINT OF SALE</span></footer></main></div></body></html>
