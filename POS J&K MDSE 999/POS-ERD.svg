<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183f30" flood-opacity=".10"/></filter><style>text{font-family:Arial,Helvetica,sans-serif;fill:#24332b}.title{font-size:30px;font-weight:700;fill:#183f30}.sub{font-size:15px;fill:#718078}.head{font-size:19px;font-weight:700}.field{font-size:15px}.label{font-size:13px;fill:#53665a}.note{font-size:14px;fill:#42544a}.card{fill:#fff;stroke:#176b50;stroke-width:2;filter:url(#shadow)}.orange{stroke:#cb754b}.rule{stroke:#e6ece7;stroke-width:1}</style></defs>
<rect width="1400" height="900" fill="#f7f9f7"/>
<text x="70" y="70" class="title">J&amp;K MDSE STORE 999</text><text x="70" y="108" class="title" font-size="22">POINT OF SALE · DATABASE ERD</text><text x="70" y="143" class="sub">MySQL relational model · sales preserve item name and price snapshots</text>
<!-- relationship connectors behind tables -->
<path d="M390 318 H430 V300 H480" fill="none" stroke="#176b50" stroke-width="2.5"/><text x="397" y="290" class="label">processes · 1 to many</text>
<path d="M810 315 H860" fill="none" stroke="#176b50" stroke-width="2.5"/><text x="815" y="290" class="label">contains · 1 to many</text>
<path d="M1005 570 V650 H965 V470" fill="none" stroke="#cb754b" stroke-width="2.5" stroke-dasharray="8 7"/><text x="1018" y="615" class="label" fill="#81593f">product reference</text><text x="1018" y="635" class="label" fill="#81593f">optional after removal</text>
<!-- USERS -->
<rect x="70" y="205" width="320" height="300" rx="14" class="card"/><text x="95" y="243" class="head">USERS</text><line x1="90" y1="260" x2="370" y2="260" class="rule"/>
<text x="95" y="294" class="field"><tspan font-weight="700">PK</tspan><tspan dx="12">id : BIGINT</tspan></text><text x="95" y="326" class="field">username : VARCHAR(60) · UNIQUE</text><text x="95" y="358" class="field">password_hash : VARCHAR(255)</text><text x="95" y="390" class="field">full_name : VARCHAR(120)</text><text x="95" y="422" class="field">role : ADMIN | CASHIER</text><text x="95" y="454" class="field">is_active : BOOLEAN</text><text x="95" y="486" class="field">created_at : TIMESTAMP</text>
<!-- SALES -->
<rect x="480" y="185" width="330" height="355" rx="14" class="card"/><text x="505" y="223" class="head">SALES</text><line x1="500" y1="240" x2="790" y2="240" class="rule"/>
<text x="505" y="274" class="field"><tspan font-weight="700">PK</tspan><tspan dx="12">id : BIGINT</tspan></text><text x="505" y="306" class="field">transaction_no : VARCHAR · UNIQUE</text><text x="505" y="338" class="field"><tspan font-weight="700">FK</tspan><tspan dx="12">user_id : BIGINT</tspan></text><text x="505" y="370" class="field">subtotal : DECIMAL(12,2)</text><text x="505" y="402" class="field">discount : DECIMAL(12,2)</text><text x="505" y="434" class="field">total : DECIMAL(12,2)</text><text x="505" y="466" class="field">amount_paid : DECIMAL(12,2)</text><text x="505" y="498" class="field">change_due : DECIMAL(12,2)</text><text x="505" y="530" class="field">created_at : TIMESTAMP</text>
<!-- SALE ITEMS -->
<rect x="860" y="205" width="450" height="300" rx="14" class="card orange"/><text x="885" y="243" class="head">SALE_ITEMS</text><line x1="880" y1="260" x2="1290" y2="260" class="rule"/>
<text x="885" y="294" class="field"><tspan font-weight="700">PK</tspan><tspan dx="12">id : BIGINT</tspan></text><text x="885" y="326" class="field"><tspan font-weight="700">FK</tspan><tspan dx="12">sale_id : BIGINT</tspan></text><text x="885" y="358" class="field"><tspan font-weight="700">FK</tspan><tspan dx="12">product_id : BIGINT · nullable</tspan></text><text x="885" y="390" class="field">product_name : VARCHAR(150) · snapshot</text><text x="885" y="422" class="field">quantity : INT</text><text x="885" y="454" class="field">unit_price : DECIMAL · snapshot</text><text x="885" y="486" class="field">line_total : DECIMAL(12,2)</text>
<!-- PRODUCTS -->
<rect x="860" y="570" width="450" height="240" rx="14" class="card orange"/><text x="885" y="608" class="head">PRODUCTS</text><line x1="880" y1="625" x2="1290" y2="625" class="rule"/>
<text x="885" y="659" class="field"><tspan font-weight="700">PK</tspan><tspan dx="12">id : BIGINT</tspan></text><text x="885" y="691" class="field">name : VARCHAR(150) · price : DECIMAL</text><text x="885" y="723" class="field">category : VARCHAR(100) · stock_qty : INT</text><text x="885" y="755" class="field">is_active : BOOLEAN · timestamps</text>
<!-- relationship notes -->
<rect x="70" y="585" width="700" height="225" rx="14" fill="#edf4ef" stroke="#d8e6dc"/><text x="98" y="628" class="head" font-size="17">RELATIONSHIP NOTES</text><text x="98" y="668" class="note">• One admin or cashier can process many sales.</text><text x="98" y="704" class="note">• Each sale contains one or more sale item rows.</text><text x="98" y="740" class="note">• Product link can be null; sold name and price remain on the receipt.</text><text x="98" y="776" class="note">• Products and users are deactivated to preserve transaction history.</text>
<text x="70" y="855" class="sub" font-size="13"><tspan font-weight="700">PK</tspan> Primary key · <tspan font-weight="700">FK</tspan> Foreign key · Green: required relation · Orange dashed: optional product relation</text>
</svg>
